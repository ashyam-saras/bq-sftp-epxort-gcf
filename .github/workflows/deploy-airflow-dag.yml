name: Deploy Airflow DAG to Cloud Composer

on:
  push:
    branches: [main]
    paths:
      - 'airflow/dags/**'
      - '.github/workflows/deploy-airflow-dag.yml'
  workflow_dispatch:

env:
  PROJECT_ID: insightsprod
  # Org-level GitHub variable, e.g. gs://us-central1-edm-pulse-compo-d334fad9-bucket/dags
  DAGS_PATH: ${{ vars.PULSE_AIRFLOW_DAGS_PATH }}
  DAG_SUBFOLDER: boxout_sftp_export

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Sync DAG to Cloud Composer
        run: |
          if [ -z "${DAGS_PATH}" ]; then
            echo "::error::PULSE_AIRFLOW_DAGS_PATH organization variable is not set"
            exit 1
          fi
          TARGET="${DAGS_PATH%/}/${DAG_SUBFOLDER}"
          echo "Syncing DAG files to Cloud Composer..."
          echo "Source: airflow/dags/"
          echo "Target: ${TARGET}/"
          # rsync -d deletes files in destination not present in source
          gsutil -m rsync -r -d airflow/dags/ "${TARGET}/"
          echo "✅ DAG files synced successfully"

      - name: List deployed files
        run: |
          TARGET="${DAGS_PATH%/}/${DAG_SUBFOLDER}"
          echo "Files in Composer DAGs folder:"
          gsutil ls -r "${TARGET}/"
